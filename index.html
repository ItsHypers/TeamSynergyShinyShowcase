<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Team Synergy!</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.png" type="image/png">
</head>
<body>
  <!-- NAVIGATION BAR -->
<nav id="top-nav">
  <ul>
    <li class="active">Shiny Showcase</li>
    <li>SHOTM</li>
  </ul>
</nav>

<section class="background"></section>
<div class="stars-container"></div>



<div id="main-container"></div>
  <h1>Team Synergy Shiny Showcase!</h1>
  <img src="pagebreak.png" alt="Page Break" class="pagebreak">

  <div class="search-bar">
    <input type="text" id="playerSearch" placeholder="Search for a player...">

  <div id="showcase"></div>
</div>
<script src="script.js"></script>
<script>
  renderShowcase();

  // Auto-update when tab becomes active
  window.addEventListener("focus", () => {
    renderShowcase();
  });
</script>

</html>
