<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shiny Showcase</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Team Synergy Shiny Showcase!</h1>
<img src="pagebreak.png" alt="Page Break" class="pagebreak">

<div class="search-bar">
  <input type="text" id="playerSearch" placeholder="Search for a player...">
</div>

<div id="showcase"></div>

<script src="script.js"></script>
<script>
  renderShowcase();

  // Auto-update when tab becomes active
  window.addEventListener("focus", () => {
    renderShowcase();
  });
</script>
</body>
</html>
