<div id="encounter-counter-page" class="encounter-page">
  <h2>PokeMMO Encounter Counter Generator</h2>

  <div class="form-group">
    <label for="zipFileInput">Upload a gif or image</label>
    <input id="zipFileInput" type="file" accept="image/gif,image/png,image/webp,image/jpeg,image/jpg">
  </div>

<div class="form-group size-group">
  <label>Gif/Image Size</label>
  <div class="size-inputs">
    <div>
      <span>Width</span>
      <input type="number" id="gifWidth" value="300" min="1">
    </div>
    <div>
      <span>Height</span>
      <input type="number" id="gifHeight" value="250" min="1">
    </div>
  </div>
</div>



  <div class="form-group">
    <label for="zipName">Theme Name:</label>
    <input type="text" id="zipName" placeholder="Custom Theme.zip" value="Custom Theme">
  </div>

  <div class="form-group">
    <label for="minimisedFile">Minimised Image (optional):</label>
    <input type="file" id="minimisedFile" accept="image/*">
  </div>

  <div class="form-group size-group">
  <label>Minimised Image Size</label>
  <div class="size-inputs">
    <div>
      <span>Width</span>
      <input type="number" id="miniWidth" value="200" min="1">
    </div>
    <div>
      <span>Height</span>
      <input type="number" id="miniHeight" value="50" min="1">
    </div>
  </div>
</div>


  <div class="form-group">
    <label for="frameDuration">Frame Duration (ms)</label>
    <input type="number" id="frameDuration" value="100" min="1" step="1">
  </div>

  <div id="zipStatus"></div>

  <button id="generateZip" disabled>Generate XML & Zip</button>
</div>
