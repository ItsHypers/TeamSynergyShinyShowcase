<div id="admin-form-container" class="admin-panel" style="display:none;">
  <h1>Admin Panel - Add Pokémon</h1>

  <label for="player">Player Name:</label>
  <input type="text" id="player" placeholder="AceZ" />

  <label for="pokemon">Pokémon Name:</label>
  <input type="text" id="pokemon" placeholder="Pikachu" />

  <label for="month">Month:</label>
  <input type="text" id="month" placeholder="January" />

  <label for="year">Year:</label>
  <input type="text" id="year" placeholder="2026" />

  <label for="egg">Egg:</label>
  <select id="egg">
    <option value="Yes">Yes</option>
    <option value="No" selected>No</option>
  </select>

  <label for="favourite">Favourite:</label>
  <select id="favourite">
    <option value="Yes">Yes</option>
    <option value="No" selected>No</option>
  </select>

  <label for="secretShiny">Secret Shiny:</label>
  <select id="secretShiny">
    <option value="Yes">Yes</option>
    <option value="No" selected>No</option>
  </select>

  <label for="alpha">Alpha:</label>
  <select id="alpha">
    <option value="Yes">Yes</option>
    <option value="No" selected>No</option>
  </select>

  <label for="sold">Sold:</label>
  <select id="sold">
    <option value="Yes">Yes</option>
    <option value="No" selected>No</option>
  </select>

  <label for="event">Event:</label>
  <select id="event">
    <option value="Yes">Yes</option>
    <option value="No" selected>No</option>
  </select>

  <label for="reaction">Reaction:</label>
  <select id="reaction">
    <option value="Yes">Yes</option>
    <option value="No" selected>No</option>
  </select>

  <label for="mysteriousBall">Mysterious Ball:</label>
  <select id="mysteriousBall">
    <option value="Yes">Yes</option>
    <option value="No" selected>No</option>
  </select>

  <label for="safari">Safari:</label>
  <select id="safari">
    <option value="Yes">Yes</option>
    <option value="No" selected>No</option>
  </select>

  <label for="honeyTree">Honey Tree:</label>
  <select id="honeyTree">
    <option value="Yes">Yes</option>
    <option value="No" selected>No</option>
  </select>

  <label for="legendary">Legendary:</label>
  <select id="legendary">
    <option value="Yes">Yes</option>
    <option value="No" selected>No</option>
  </select>

  <label for="reactionLink">Reaction Link:</label>
  <input type="text" id="reactionLink" placeholder="Optional URL" />

  <button id="addBtn">Add Pokémon</button>
  <div id="message" class="info"></div>

  <h2>Preview JSON:</h2>
  <pre id="preview" class="preview-box"></pre>
</div>
