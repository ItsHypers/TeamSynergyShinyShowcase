<div id="admin-form-container" class="admin-panel" style="display:block;">
  <h1>Admin Panel</h1>

  <label for="mode">Select Mode:</label>
  <select id="mode">
    <option value="pokemon">Add Pokémon</option>
    <option value="streamer">Add Streamer</option>
  </select>

  <div id="pokemon-form">
  <label for="player">Player Name:</label>
  <input type="text" id="player" placeholder="hyper" autocomplete="off" />
  <div id="player-suggestions" class="autocomplete-suggestions"></div>

  <label for="pokemon">Pokémon Name:</label>
  <input type="text" id="pokemon" placeholder="mew" autocomplete="off" />
  <div id="pokemon-suggestions" class="autocomplete-suggestions"></div>

    <label for="month">Month:</label>
    <input type="text" id="month" value="January" placeholder="January" />

    <label for="year">Year:</label>
    <input type="text" id="year" value="2026" placeholder="2026" />

    <label for="egg">Egg:</label>
    <select id="egg">
      <option value="Yes">Yes</option>
      <option value="No" selected>No</option>
    </select>

    <label for="favourite">Favourite:</label>
    <select id="favourite">
      <option value="Yes">Yes</option>
      <option value="No" selected>No</option>
    </select>

    <label for="secretShiny">Secret Shiny:</label>
    <select id="secretShiny">
      <option value="Yes">Yes</option>
      <option value="No" selected>No</option>
    </select>

    <label for="alpha">Alpha:</label>
    <select id="alpha">
      <option value="Yes">Yes</option>
      <option value="No" selected>No</option>
    </select>

    <label for="sold">Sold:</label>
    <select id="sold">
      <option value="Yes">Yes</option>
      <option value="No" selected>No</option>
    </select>

    <label for="event">Event:</label>
    <select id="event">
      <option value="Yes">Yes</option>
      <option value="No" selected>No</option>
    </select>

    <label for="reaction">Reaction:</label>
    <select id="reaction">
      <option value="Yes">Yes</option>
      <option value="No" selected>No</option>
    </select>

    <label for="mysteriousBall">Mysterious Ball:</label>
    <select id="mysteriousBall">
      <option value="Yes">Yes</option>
      <option value="No" selected>No</option>
    </select>

    <label for="safari">Safari:</label>
    <select id="safari">
      <option value="Yes">Yes</option>
      <option value="No" selected>No</option>
    </select>

    <label for="honeyTree">Honey Tree:</label>
    <select id="honeyTree">
      <option value="Yes">Yes</option>
      <option value="No" selected>No</option>
    </select>

    <label for="legendary">Legendary:</label>
    <select id="legendary">
      <option value="Yes">Yes</option>
      <option value="No" selected>No</option>
    </select>

    <label for="reactionLink">Reaction Link:</label>
    <input type="text" id="reactionLink" placeholder="Optional URL" />
  </div>

  <div id="streamer-form" style="display:none;">
    <label for="pokeName">PokeMMO Name:</label>
    <input type="text" id="pokeName" placeholder="MiroMMO" />

    <label for="twitchName">Twitch Name:</label>
    <input type="text" id="twitchName" placeholder="MiroMMO" />
  </div>

  <button id="addBtn">Add</button>
  <div id="message" class="info"></div>
  <div id="override-container" style="display:none; margin-top:10px;">
  <label for="overrideDuplicate">
    <input type="checkbox" id="overrideDuplicate" />
    Override Duplicate
  </label>

</div>

  <div id="delete-form-container">
  <h3>Delete Data</h3>
  <label for="deletePlayer">Player:</label>
  <input type="text" id="deletePlayer" placeholder="Enter player name" autocomplete="off">
  <div id="deletePlayer-suggestions" class="autocomplete-suggestions"></div>

  <label for="deleteId">Pokémon ID:</label>
  <input type="number" id="deleteId" placeholder="Enter Pokémon ID (Optional)">

  <button id="deleteBtn">Delete Pokémon</button>
  <p id="deleteMessage"></p>
</div>

  <h3>Preview JSON:</h3>
  <pre id="preview" contenteditable="true" class="preview-box"></pre>
  <button id="updateBtn">Update JSON</button>
  <div id="update-message" class="admin-message"></div>

  <h3 id="adminlogmsg">Admin Log:</h3>
<pre id="logPreview" class="preview-box"></pre>

</div>
